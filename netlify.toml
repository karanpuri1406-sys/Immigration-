# Netlify configuration — Townhall Immigration
# Static site: no build step, publish the repo root as-is.

[build]
  publish = "."

# --- Security headers -------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# --- Caching ----------------------------------------------------------------
# Images and icons are content-stable, so cache them hard.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS are versioned via ?v= in the HTML, so they can cache hard too.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must revalidate so edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Clean URLs -------------------------------------------------------------
# Lets /work-visas resolve to /work-visas.html while the .html links still work.
[[redirects]]
  from = "/work-visas"
  to = "/work-visas.html"
  status = 200

[[redirects]]
  from = "/pr-visas"
  to = "/pr-visas.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
